<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Infillwear logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Infillwear brand logo featuring a geometric grid mark and bold wordmark in acid green and white on dark background</desc>

  

  <!-- Dark background -->
  <rect width="680" height="320" fill="#080810" rx="20" style="fill:rgb(8, 8, 16);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Grid icon mark — 3x3 squares with selective fill -->
  <!-- Row 1 -->
  <rect x="116" y="102" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="146" y="102" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="176" y="102" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Row 2 -->
  <rect x="116" y="132" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="146" y="132" width="24" height="24" rx="3" fill="none" stroke="#b8ff35" stroke-width="1.5" style="fill:none;stroke:rgb(184, 255, 53);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="176" y="132" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Row 3 -->
  <rect x="116" y="162" width="24" height="24" rx="3" fill="none" stroke="#333360" stroke-width="1.5" style="fill:none;stroke:rgb(51, 51, 96);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="146" y="162" width="24" height="24" rx="3" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="176" y="162" width="24" height="24" rx="3" fill="none" stroke="#333360" stroke-width="1.5" style="fill:none;stroke:rgb(51, 51, 96);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Row 4 extra partial — bottom extension -->
  <rect x="116" y="192" width="24" height="12" rx="3" fill="#4df4ff" opacity="0.6" style="fill:rgb(77, 244, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="146" y="192" width="24" height="12" rx="3" fill="none" stroke="#333360" stroke-width="1.5" style="fill:none;stroke:rgb(51, 51, 96);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="176" y="192" width="24" height="12" rx="3" fill="#4df4ff" opacity="0.6" style="fill:rgb(77, 244, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Wordmark -->
  <text x="228" y="165" font-family="'Unbounded', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="-2" fill="#f0f0ff" style="fill:rgb(240, 240, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Unbounded, &quot;Arial Black&quot;, sans-serif;font-size:54px;font-weight:900;text-anchor:start;dominant-baseline:auto">INFILL</text>
  <text x="228" y="210" font-family="'Unbounded', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="-2" fill="#b8ff35" style="fill:rgb(184, 255, 53);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Unbounded, &quot;Arial Black&quot;, sans-serif;font-size:54px;font-weight:900;text-anchor:start;dominant-baseline:auto">WEAR</text>

  <!-- Tagline -->
  <text x="228" y="238" font-family="'Unbounded', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="5" fill="#44445a" style="fill:rgb(68, 68, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Unbounded, Arial, sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">BUILT DIFFERENT</text>

  <!-- Thin accent line under mark -->
  <line x1="116" y1="98" x2="204" y2="98" stroke="#b8ff35" stroke-width="2" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(184, 255, 53);color:rgb(0, 0, 0);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>